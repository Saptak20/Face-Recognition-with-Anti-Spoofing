# Face Recognition System Configuration
# Based on the system configuration schema documented in README.md and src/config.py

# Model Configuration
models:
  face_detection_confidence: 0.9
  face_image_size: 160
  face_margin: 32
  min_face_size: 20
  embedding_model: "vggface2"
  embedding_dim: 512
  liveness_model_type: "custom_cnn"
  liveness_input_size: 64
  liveness_threshold: 0.5
  deepfake_model: "google/vit-base-patch16-224"
  deepfake_image_size: 224
  deepfake_threshold: 0.5
  device: "cpu"  # "cpu" or "cuda"

# Database Configuration
database:
  sqlite_db_path: "data/face_recognition.db"
  faiss_index_path: "data/embeddings/face_index.faiss"
  faiss_index_type: "IndexFlatIP"
  backup_enabled: true
  backup_interval_hours: 24
  backup_path: "data/backups"
  max_backups: 7

# Authentication Configuration
authentication:
  face_similarity_threshold: 0.7
  overall_confidence_threshold: 0.6
  face_similarity_weight: 0.5
  liveness_weight: 0.3
  deepfake_weight: 0.2
  max_attempts_per_hour: 5
  enable_mfa: false
  otp_length: 6
  otp_expiry_minutes: 5
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_email: ""
  sender_password: ""

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  workers: 1
  allowed_origins:
    - "*"
  allow_credentials: true
  api_key_required: false
  api_key: ""
  jwt_secret_key: "your-secret-key-change-this"
  max_request_size: 10485760  # 10MB
  request_timeout: 30

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  file_path: "logs/face_recognition.log"
  file_max_size_mb: 10
  file_backup_count: 5
  console_enabled: true
  rotation_enabled: true

# System Paths and Environment
project_root: "."
data_dir: "data"
models_dir: "models"
logs_dir: "logs"
config_dir: "config"
environment: "development"
